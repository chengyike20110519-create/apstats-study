<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP 统计学刷题</title>
<style>
:root{--blue:#2563eb;--green:#16a34a;--red:#dc2626;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#fff;color:var(--text);line-height:1.65;}
a{color:var(--blue);text-decoration:none;}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:10;}
.nav{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:0 16px;height:52px;}
.nav .logo{font-weight:700;font-size:16px;margin-right:12px;white-space:nowrap;}
.tab{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;border:none;background:none;}
.tab.active{color:var(--blue);background:#eff6ff;font-weight:600;}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px;}
h1{font-size:20px;margin-bottom:4px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
.card{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;background:#fff;}
.chip{display:inline-block;background:#f3f4f6;color:var(--muted);font-size:12px;border-radius:6px;padding:2px 8px;margin-right:6px;}
.chip.blue{background:#eff6ff;color:var(--blue);}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn:disabled{opacity:.5;cursor:default;}
.stem{font-size:15px;white-space:pre-wrap;margin:10px 0 14px;}
.stem img,.qimg{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:8px 0;display:block;}
.opt{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;width:100%;text-align:left;background:#fff;color:var(--text);font-family:inherit;line-height:1.55;align-items:flex-start;}
.opt:hover{border-color:var(--blue);}
.opt .letter{font-weight:700;color:var(--muted);flex:none;}
.opt.sel{border-color:var(--blue);background:#eff6ff;}
.opt.right{border-color:var(--green);background:#f0fdf4;}
.opt.right .letter{color:var(--green);}
.opt.wrong{border-color:var(--red);background:#fef2f2;}
.opt.wrong .letter{color:var(--red);}
.expl{background:#f9fafb;border-radius:10px;padding:12px 14px;font-size:14px;margin-top:10px;}
.expl b{color:var(--blue);}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px;flex-wrap:wrap;}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 16px;}
.pbar>div{height:100%;background:var(--blue);}
select,.btn.small{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.stat{font-size:13px;color:var(--muted);}
.stat b{font-size:22px;color:var(--text);display:block;}
.kd{border-left:3px solid var(--blue);padding-left:14px;margin:14px 0;}
.kd h2{font-size:16px;margin-bottom:6px;}
.kd h3{font-size:14px;margin:10px 0 4px;color:var(--blue);}
.kd ul{padding-left:20px;font-size:14px;}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0;}
td,th{border:1px solid var(--line);padding:4px 8px;text-align:left;}
input[type=range]{width:100%;}
.frmodel{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;font-size:14px;margin-top:10px;white-space:pre-wrap;}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.hidden{display:none;}
.badge-done{color:var(--green);font-size:12px;}
</style>
</head>
<body>
<header><nav class="nav">
  <span class="logo">📊 AP 统计刷题</span>
  <button class="tab active" data-view="home">首页</button>
  <button class="tab" data-view="practice">选择题</button>
  <button class="tab" data-view="fr">简答题</button>
  <button class="tab" data-view="wrong">错题本</button>
  <button class="tab" data-view="knowledge">知识点</button>
</nav></header>
<main id="app"></main>
<script src="js/questions.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
